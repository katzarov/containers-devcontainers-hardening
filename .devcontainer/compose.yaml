x-hardening: &hardening
  # Drop the same capabilities as the previous devcontainer runArgs.
  cap_drop:
    - ALL
    - NET_RAW

  security_opt:
    - no-new-privileges
    - apparmor:docker-default
    # Codex/bwrap needs to create its nested sandbox.
    - seccomp=unconfined

  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

  network_mode: bridge
  dns:
    - 1.1.1.3
    - 1.0.0.3

  # Optional hardening and resource limits:
  # tmpfs:
  #   - /tmp:rw,noexec,nosuid,size=512m
  #   - /var/tmp:rw,noexec,nosuid,size=512m
  #   - /dev/shm:rw,noexec,nosuid,size=64m
  # mem_limit: 512m
  # cpus: 2
  # network_mode: none

services:
  devcontainer:
    <<: *hardening
    image: mcr.microsoft.com/devcontainers/base:debian
    volumes:
      - type: bind
        source: ..
        target: /workspaces/containers-devcontainers-hardening
        read_only: false
      - type: volume
        source: codex-data
        target: /home/vscode/.codex

volumes:
  codex-data:
    # Reuse the exact volume created by initializeCommand.
    name: codex-data
    external: true
